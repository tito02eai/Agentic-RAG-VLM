name: Offline software checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MUJOCO_GL: egl
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BLUPE_RUNNER_CHECKOUT: ${{ github.workspace }}/third_party/blupe-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            configs/extended_sim_dependencies.txt
      - name: Check out pinned official runner
        uses: actions/checkout@v4
        with:
          repository: andlyu/blupe-remote-bots
          ref: e6040394c5ed62efbcc7d627acc0dfc8ccc100a6
          path: third_party/blupe-runner
      - name: Install CPU test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r configs/extended_sim_dependencies.txt
          python -m pip install -e '.[runner]'
      - name: Run local contracts and integration fixtures
        run: python -m pytest -q tests --durations=10
